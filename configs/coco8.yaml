# 说明：本文件仅作「YOLO 检测数据 yaml」格式参考。
# 入门训练脚本默认使用 Ultralytics 内置名 "coco8.yaml"（会自动下载迷你集）。
# 自定义数据请复制 my_dataset.example.yaml 修改。
#
# 若坚持用本文件训练，请把 path 改成数据集绝对路径，例如:
#   path: C:/Users/你/datasets/coco8

path: coco8
train: images/train
val: images/val

